<!-- Critical inline CSS: tokens + ignition screen. Prevents any flash before main.css lands. -->
<style>
:root{
  --bg:#070707;--bg-2:#0c0c0e;--bg-3:#121215;--bg-4:#17171b;
  --line:#1b1b1e;--line-2:#282830;--line-3:#3a3a44;
  --ink:#fafafa;--ink-dim:#96969e;--ink-faint:#5a5a64;
  --red:#E8002B;--red-2:#ff2f4f;--red-glow:rgba(232,0,43,.5);
  --mag:#C800FF;--grn:#00D26A;--yel:#FFD600;--cyan:#25E5FF;
  --soft:#FF1E1E;--med:#FFD600;--hard:#E8E8E8;
  --ease:cubic-bezier(.22,.61,.24,1);
  --gut:clamp(18px,4vw,72px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
#ignition{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(26px,5vh,52px);
  will-change:opacity,transform;
}
#ignition.gone{opacity:0;visibility:hidden;pointer-events:none}
.ig-brand{font-family:'Anton','Archivo Narrow',sans-serif;font-size:clamp(46px,9vw,110px);letter-spacing:.04em;text-transform:uppercase;line-height:1;overflow:hidden}
.ig-brand em{color:var(--red);font-style:normal}
.ig-sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint)}
.ig-lights{display:flex;gap:clamp(9px,2vw,16px)}
.ig-light{width:clamp(34px,7vw,52px);aspect-ratio:1;border-radius:50%;background:#111114;border:2px solid #202026;position:relative}
.ig-light::before{content:'';position:absolute;inset:6px;border-radius:50%;background:#070709;box-shadow:inset 0 2px 7px rgba(0,0,0,.8)}
.ig-light.on::before{background:radial-gradient(circle at 35% 32%,#ff6070,var(--red) 55%,#5e0012 100%);box-shadow:0 0 26px var(--red-glow),0 0 60px rgba(232,0,43,.28),inset 0 0 10px rgba(255,255,255,.3)}
.ig-bar{width:min(260px,60vw);height:2px;background:#1c1c22;position:relative;overflow:hidden}
.ig-bar>i{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--red),var(--red-2));box-shadow:0 0 12px var(--red-glow)}
.ig-pct{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.28em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.boot-hidden{opacity:0}
</style>
